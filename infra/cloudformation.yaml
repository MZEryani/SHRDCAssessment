AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SHRDC Assessment EC2 Demo Portal: 3-container Docker Compose stack (Caddy automatic HTTPS,
  Demo Portal + OIP WebSocket-to-Modbus TCP bridge + OpenCode agents, OpenPLC Runtime v4)
  with IMDSv2, SSM-only access (no SSH port 22), encrypted gp3 EBS, permanent Elastic IP,
  and least-privilege Secrets Manager integration.

Parameters:
  RepoUrl:
    Type: String
    Default: https://github.com/MZEryani/SHRDCAssessment.git
    AllowedPattern: '^https://[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+\.git$'
    ConstraintDescription: Must be an HTTPS Git repository URL ending in .git.
    Description: Public Git repository URL cloned on the EC2 host.
  RepoBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    ConstraintDescription: Must be a valid git branch name without shell metacharacters.
    Description: Git branch to deploy on the EC2 host.
  SecretName:
    Type: String
    Default: shrdc-assessment/demo-portal
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]{1,128}$'
    ConstraintDescription: Must be a valid AWS Secrets Manager secret name.
    Description: AWS Secrets Manager secret name holding DEMO_ACCESS_TOKEN, OPENPLC_PASSWORD, and GEMINI_API_KEY.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - c7i-flex.large
      - m7i-flex.large
    Description: x86_64 EC2 instance type (c7i-flex.large / m7i-flex.large are Free-Plan eligible; t3.medium for standard Paid accounts).
  DailyGenerationCap:
    Type: Number
    Default: 10
    MinValue: 0
    MaxValue: 100
    Description: Maximum live Task 2 AI Cell generations allowed per UTC day.
  BudgetAlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be empty or a valid email address.
    Description: Optional email address for a $15/month AWS Budget alert (leave empty to skip creating the budget).
  CustomDomain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Must be empty (uses <eip>.sslip.io) or a lowercase DNS hostname (e.g. shrdc-demo.duckdns.org).
    Description: Optional custom hostname pointing to the Elastic IP (defaults to <ElasticIp>.sslip.io when empty).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI resolved automatically via SSM Parameter Store.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetAlertEmail, '']]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]

Resources:
  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  DemoInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  DemoVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVpc
      InternetGatewayId: !Ref DemoInternetGateway

  DemoPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  DemoDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref DemoRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoInternetGateway

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DemoPublicSubnet
      RouteTableId: !Ref DemoRouteTable

  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP (ACME and HTTPS redirect) and HTTPS only; SSH port 22 closed (SSM Session Manager only)
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for Caddy ACME challenge and HTTPS redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for Caddy reverse proxy (Demo Portal + OIP + WSS)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound HTTPS for Docker pulls, GitHub, Gemini API, ACME, SSM, and Secrets Manager
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: ReadDemoPortalSecretOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetDemoPortalSecretValue
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-??????'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DemoInstanceRole

  DemoElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: DemoVpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eip'

  DemoLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 30
              Encrypted: true
              DeleteOnTermination: true

  DemoInstance:
    Type: AWS::EC2::Instance
    DependsOn: DemoDefaultRoute
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref DemoLaunchTemplate
        Version: !GetAtt DemoLaunchTemplate.LatestVersionNumber
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref DemoInstanceProfile
      SubnetId: !Ref DemoPublicSubnet
      SecurityGroupIds:
        - !Ref DemoSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # 1. Configure 2 GiB swapfile for t3.medium headroom during OIP build & OpenCode worktrees
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # 2. Install Docker, Git, jq, and SHA-256-verified Docker Compose v2.35.1 plugin on Amazon Linux 2023
          dnf install -y docker git jq
          mkdir -p /usr/local/lib/docker/cli-plugins
          COMPOSE_BIN=/usr/local/lib/docker/cli-plugins/docker-compose
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.35.1/docker-compose-linux-x86_64" \
            -o "$COMPOSE_BIN"
          echo "7bdb2ce2916e5dd0354e5d129892bf96fdcdb1a9ab8eed69b9173e131db4c230  $COMPOSE_BIN" | sha256sum -c -
          chmod +x "$COMPOSE_BIN"
          systemctl enable --now docker

          # 3. Clone repository
          APP_DIR=/opt/shrdc-assessment
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch "${RepoBranch}" "${RepoUrl}" "$APP_DIR"
          fi

          # 4. Install root-only runtime secret refresh helper (zero-echo, fail-fast on missing keys)
          cat <<'EOF' > /usr/local/bin/shrdc-refresh-env
          #!/bin/bash
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value --region "${AWS::Region}" --secret-id "${SecretName}" --query SecretString --output text)"
          DEMO_TOKEN="$(printf '%s' "$SECRET_JSON" | jq -er '.DEMO_ACCESS_TOKEN | select(type=="string" and length>0)')"
          PLC_PASS="$(printf '%s' "$SECRET_JSON" | jq -er '.OPENPLC_PASSWORD | select(type=="string" and length>0)')"
          GEMINI_KEY="$(printf '%s' "$SECRET_JSON" | jq -r '.GEMINI_API_KEY // ""')"
          DOMAIN_VALUE="${CustomDomain}"
          if [ -f /etc/shrdc-domain ]; then
            DOMAIN_VALUE="$(tr -d '[:space:]' < /etc/shrdc-domain)"
          fi
          if [ -z "$DOMAIN_VALUE" ]; then
            DOMAIN_VALUE="${DemoElasticIP}.sslip.io"
          fi
          umask 077
          TMP_ENV="/opt/shrdc-assessment/.env.runtime.tmp"
          {
            printf 'DEMO_DOMAIN=%s\n' "$DOMAIN_VALUE"
            printf 'DAILY_GENERATION_CAP=%s\n' "${DailyGenerationCap}"
            printf 'FORCE_SECURE_COOKIES=1\n'
            printf 'DEMO_ACCESS_TOKEN=%s\n' "$DEMO_TOKEN"
            printf 'OPENPLC_PASSWORD=%s\n' "$PLC_PASS"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_KEY"
          } > "$TMP_ENV"
          chmod 600 "$TMP_ENV"
          mv -f "$TMP_ENV" /opt/shrdc-assessment/.env.runtime
          EOF
          chmod 700 /usr/local/bin/shrdc-refresh-env

          # 5. Fetch secrets and start 3-container Docker Compose stack
          /usr/local/bin/shrdc-refresh-env
          cd "$APP_DIR"
          docker compose --env-file .env.runtime -f docker-compose.ec2.yml up -d --build
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2'

  DemoEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DemoElasticIP.AllocationId
      InstanceId: !Ref DemoInstance

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-15usd'
        BudgetLimit:
          Amount: 15
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  InstanceId:
    Description: EC2 Instance ID for SSM Session Manager and lifecycle scripts
    Value: !Ref DemoInstance
  ElasticIp:
    Description: Permanent Elastic IPv4 address attached to the EC2 instance
    Value: !Ref DemoElasticIP
  DemoUrl:
    Description: Automatic HTTPS URL served by Caddy (CustomDomain when set, otherwise sslip.io)
    Value: !If [HasCustomDomain, !Sub 'https://${CustomDomain}', !Sub 'https://${DemoElasticIP}.sslip.io']
  SsmSessionCommand:
    Description: Interactive shell access via AWS Systems Manager Session Manager (no SSH port 22)
    Value: !Sub 'aws ssm start-session --target ${DemoInstance} --region ${AWS::Region}'
