services:
  openplc-runtime:
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    container_name: openplc-runtime
    ports:
      - "8443:8443"
      - "502:502"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    volumes:
      - openplc-runtime-data:/var/run/runtime
    restart: unless-stopped

volumes:
  openplc-runtime-data:
